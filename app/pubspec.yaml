name: aisthetron
description: Aisthetron — an instrument of perception bridging wearables and self-hosted infrastructure.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebSocket connectivity
  web_socket_channel: ^3.0.0

  # Foreground service (keeps process alive on Android)
  flutter_foreground_task: ^8.11.0

  # Local notifications (alert popups)
  flutter_local_notifications: ^17.0.0

  # HTTP for fetching history
  http: ^1.2.0

  # Persistent settings (server URL + token)
  shared_preferences: ^2.3.0

  # Scrubbable metric line graphs
  fl_chart: ^0.69.0

  # Calendar day-picker (Health + Notifications)
  table_calendar: ^3.1.2

  # Material You dynamic color — match the phone's system theme.
  # Pinned: 1.9.0's Android build.gradle.kts uses a Kotlin DSL that breaks in
  # the Flutter plugin-module context.
  dynamic_color: 1.7.0

  # Biometric / device-credential gate before viewing logs (and later, control).
  local_auth: ^2.3.0

  # Control token in the Android Keystore, not plain SharedPreferences.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
